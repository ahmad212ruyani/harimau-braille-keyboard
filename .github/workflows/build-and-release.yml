name: Build Harimau Braille Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "harimau-braille-fallback",
              "storage_bucket": "harimau-braille-fallback.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.hbk.ruyani"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeFallbackApiKeyForBuildOnly"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant Execute Permission for Gradlew (if exists)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output/HarimauBrailleKeyboard-debug.apk \;

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HarimauBrailleKeyboard-debug-apk
          path: output/HarimauBrailleKeyboard-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output/HarimauBrailleKeyboard-debug.apk
          name: Release ${{ github.ref_name || 'Latest' }}
          tag_name: ${{ github.ref_name || 'latest' }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
